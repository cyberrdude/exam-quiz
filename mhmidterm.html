<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maliyyə Hesabatlılığı Midterm</title>
<style>
  :root {
    --bg: #f5f7fb; --ink: #162033; --muted: #647084; --panel: #ffffff; --line: #dfe5ef;
    --brand: #2563eb; --brand-dark: #1d4ed8; --good: #16a34a; --good-soft: #dcfce7;
    --bad: #dc2626; --bad-soft: #fee2e2; --amber: #f59e0b;
    --shadow: 0 22px 70px rgba(25, 35, 55, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background:
      radial-gradient(circle at 18% 12%, rgba(37, 99, 235, 0.16), transparent 28%),
      radial-gradient(circle at 84% 18%, rgba(245, 158, 11, 0.16), transparent 24%),
      linear-gradient(180deg, #f8fbff 0%, var(--bg) 48%, #eef3f8 100%);
    background-attachment: fixed;
    color: var(--ink); min-height: 100vh; overflow-x: hidden;
  }
  button, a, textarea { font: inherit; }
  button { border: 0; }
  .hidden { display: none !important; }

  .app-topbar {
    align-items: center; display: flex; gap: 14px; justify-content: space-between;
    left: 50%; max-width: 980px; padding: 18px 20px; position: fixed; top: 0;
    transform: translateX(-50%); width: min(100%, 980px); z-index: 10;
  }
  .back-btn, .ghost-btn, .primary-btn {
    align-items: center; border-radius: 8px; cursor: pointer; display: inline-flex;
    font-size: 14px; font-weight: 800; gap: 8px; min-height: 42px; padding: 10px 14px;
    text-decoration: none; transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }
  .back-btn, .ghost-btn {
    background: rgba(255,255,255,0.92); border: 1px solid var(--line); color: var(--ink);
    box-shadow: 0 10px 28px rgba(26,38,62,0.08);
  }
  .primary-btn { background: var(--brand); color: #fff; box-shadow: 0 14px 30px rgba(37,99,235,0.24); }
  .back-btn:hover, .ghost-btn:hover, .primary-btn:hover { transform: translateY(-2px); }
  .primary-btn:disabled, .ghost-btn:disabled { cursor: default; opacity: 0.45; transform: none; }
  .quiz-title {
    background: rgba(255,255,255,0.92); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 28px rgba(26,38,62,0.08); color: var(--muted); font-size: 13px;
    font-weight: 900; letter-spacing: 0.08em; padding: 11px 14px; text-transform: uppercase;
  }

  .portion-screen { align-items: center; display: flex; min-height: 100svh; padding: 96px 20px 34px; }
  .portion-card {
    background: rgba(255,255,255,0.92); border: 1px solid rgba(223,229,239,0.9); border-radius: 8px;
    box-shadow: var(--shadow); margin: 0 auto; max-width: 980px; padding: clamp(22px,5vw,42px); width: 100%;
  }
  .eyebrow { color: var(--brand); font-size: 13px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; }
  h1 { font-size: clamp(34px,7vw,72px); letter-spacing: 0; line-height: 0.95; margin-top: 12px; max-width: 760px; }
  .portion-copy { color: var(--muted); font-size: clamp(16px,2.4vw,20px); line-height: 1.55; margin-top: 16px; max-width: 680px; }
  .portion-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 30px; }
  .portion-btn {
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 14px 34px rgba(22,32,51,0.08); color: var(--ink); cursor: pointer;
    min-height: 98px; padding: 18px; text-align: left;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .portion-btn:hover { border-color: var(--brand); box-shadow: 0 18px 40px rgba(37,99,235,0.16); transform: translateY(-4px); }
  .portion-range { display: block; font-size: 22px; font-weight: 900; }
  .portion-meta { color: var(--muted); display: block; font-size: 13px; font-weight: 700; margin-top: 8px; }

  /* Normal page scrolling — no snap, no forced jumps */
  .quiz-screen { padding: 140px 20px 70vh; }
  .quiz-hud {
    left: 50%; max-width: 980px; padding: 70px 20px 0; pointer-events: none;
    position: fixed; top: 0; transform: translateX(-50%); width: min(100%, 980px); z-index: 9;
  }
  .hud-row {
    align-items: center; background: rgba(255,255,255,0.95); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 12px 30px rgba(26,38,62,0.08); display: grid;
    gap: 12px; grid-template-columns: 1fr auto; padding: 10px 12px;
  }
  .progress-track { background: #e6edf6; border-radius: 999px; height: 10px; overflow: hidden; }
  .progress-fill { background: linear-gradient(90deg, var(--brand), var(--good)); height: 100%; transition: width 0.25s ease; width: 0; }
  .score-pill { color: var(--ink); font-size: 13px; font-weight: 900; min-width: 92px; text-align: right; }
  .question-slide { margin: 0 auto 28px; max-width: 860px; scroll-margin-top: 136px; }
  .question-card, .result-card {
    background: rgba(255,255,255,0.97); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); overflow: hidden; padding: clamp(20px,4vw,34px); position: relative; width: 100%;
  }
  .question-card.correct-answer { animation: cardCorrectImpact 0.72s cubic-bezier(0.2,1.4,0.32,1) both; box-shadow: 0 26px 86px rgba(22,163,74,0.30); }
  .question-card.wrong-answer { animation: cardWrongImpact 0.62s ease both; box-shadow: 0 26px 86px rgba(220,38,38,0.26); }
  .question-meta { align-items: center; color: var(--muted); display: flex; font-size: 13px; font-weight: 900; justify-content: space-between; margin-bottom: 18px; text-transform: uppercase; }
  .question-text { font-size: clamp(18px,2.7vw,26px); font-weight: 800; line-height: 1.35; }

  .answer-box {
    background: #fff; border: 2px solid var(--line); border-radius: 8px; color: var(--ink);
    display: block; font-size: 16px; line-height: 1.55; margin-top: 20px; min-height: 190px;
    padding: 14px; resize: vertical; width: 100%; transition: border-color 0.16s ease, background 0.16s ease;
  }
  .answer-box:focus { border-color: var(--brand); outline: none; }
  .answer-box.right { background: var(--good-soft); border-color: var(--good); }
  .answer-box.wrong { background: var(--bad-soft); border-color: var(--bad); }
  .answer-actions { align-items: center; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .kbd-hint { color: var(--muted); font-size: 12px; font-weight: 700; margin-left: auto; }
  .verdict { font-weight: 900; margin-top: 14px; }
  .verdict:empty { display: none; }
  .verdict.good { color: var(--good); }
  .verdict.bad { color: var(--bad); }
  .card-feedback { background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; padding: 12px 14px; }
  .card-feedback:empty { display: none; }

  .legend { color: var(--muted); display: flex; flex-wrap: wrap; font-size: 12px; font-weight: 700; gap: 6px 14px; }
  .legend span span { border-radius: 4px; padding: 1px 4px; }
  .diff { font-size: 15px; line-height: 2; margin-top: 8px; }
  .diff span { border-radius: 4px; padding: 1px 3px; }
  .w-wrong, .w-extra { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
  .w-fix { background: var(--good-soft); color: #14532d; font-weight: 800; }
  .w-missing { background: #fef3c7; border-bottom: 2px dashed var(--amber); color: #92400e; font-weight: 800; }

  .confetti { inset: 0; overflow: hidden; pointer-events: none; position: absolute; }
  .confetti i { animation: confettiDrop 1200ms ease-out forwards; background: var(--brand); border-radius: 2px; height: 18px; left: 50%; opacity: 0; position: absolute; top: 38%; width: 9px; }
  .confetti .x-particle { animation: xBurst 900ms cubic-bezier(0.12,0.72,0.2,1) forwards; color: var(--bad); font-size: 34px; font-weight: 950; left: 50%; line-height: 1; opacity: 0; position: absolute; text-shadow: 0 8px 24px rgba(127,29,29,0.38); top: 42%; }
  .answer-flash { inset: 0; opacity: 0; pointer-events: none; position: fixed; z-index: 40; }
  .answer-flash.correct { animation: flashCorrect 620ms ease-out both; background: radial-gradient(circle at center, rgba(34,197,94,0.34), rgba(34,197,94,0.12) 34%, transparent 72%); }
  .answer-flash.incorrect { animation: flashWrong 620ms ease-out both; background: radial-gradient(circle at center, rgba(239,68,68,0.34), rgba(239,68,68,0.12) 34%, transparent 72%); }
  .toast {
    align-items: center; background: rgba(255,251,235,0.97); border: 1px solid rgba(245,158,11,0.42);
    border-radius: 8px; box-shadow: 0 18px 42px rgba(146,64,14,0.18); color: #92400e;
    display: flex; font-size: 15px; font-weight: 950; left: 50%; opacity: 0;
    padding: 13px 16px; pointer-events: none; position: fixed; top: 128px;
    transform: translate(-50%, -12px) scale(0.96); z-index: 50;
  }
  .toast.show { animation: toastPop 1300ms ease both; }

  .result-card { text-align: center; }
  .result-card.finished { animation: resultPop 900ms cubic-bezier(0.2,1.35,0.34,1) both; box-shadow: 0 30px 96px rgba(37,99,235,0.28); }
  .score-display { color: var(--brand); font-size: clamp(54px,12vw,110px); font-weight: 950; line-height: 1; margin-top: 16px; }
  .score-percentage { color: var(--muted); font-size: 18px; font-weight: 800; margin-top: 8px; }
  .result-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
  .mistakes-section { background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; margin-top: 24px; padding: 16px; text-align: left; }
  .mistakes-section h2 { margin-bottom: 8px; }
  .mistake-item { background: #fff; border-left: 4px solid var(--bad); border-radius: 8px; margin-top: 12px; padding: 12px; }
  .mistake-item.fixed { border-left-color: var(--amber); }
  .mistake-question { font-weight: 800; line-height: 1.45; }
  .mistake-score { color: var(--muted); font-size: 13px; font-weight: 800; margin-top: 6px; }

  @keyframes cardCorrectImpact { 0% { transform: scale(1); } 38% { transform: scale(1.012); } 100% { transform: scale(1); } }
  @keyframes cardWrongImpact { 0%, 100% { transform: translateX(0); } 18% { transform: translateX(-8px); } 36% { transform: translateX(8px); } 54% { transform: translateX(-5px); } 72% { transform: translateX(3px); } }
  @keyframes confettiDrop { 0% { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(520deg); } }
  @keyframes xBurst { 0% { opacity: 0; transform: translate(0,0) rotate(0deg) scale(0.5); } 16% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1.25); } }
  @keyframes flashCorrect { 0% { opacity: 0; transform: scale(0.9); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.18); } }
  @keyframes flashWrong { 0% { opacity: 0; transform: scale(0.92); } 18% { opacity: 1; } 100% { opacity: 0; transform: scale(1.12); } }
  @keyframes toastPop { 0% { opacity: 0; transform: translate(-50%,-12px) scale(0.96); } 14% { opacity: 1; transform: translate(-50%,0) scale(1.02); } 80% { opacity: 1; transform: translate(-50%,0) scale(1); } 100% { opacity: 0; transform: translate(-50%,-10px) scale(0.98); } }
  @keyframes resultPop { 0% { opacity: 0; transform: translateY(34px) scale(0.92); } 54% { opacity: 1; transform: translateY(-8px) scale(1.025); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

  @media (max-width: 680px) {
    .app-topbar { padding: 12px; }
    .quiz-title { display: none; }
    .quiz-hud { padding: 62px 12px 0; }
    .quiz-screen { padding: 124px 12px 70vh; }
    .question-slide { scroll-margin-top: 120px; }
    .question-card, .result-card, .portion-card { padding: 18px; }
    .kbd-hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header class="app-topbar">
  <a href="index.html" class="back-btn" id="main-menu-link"></a>
  <div class="quiz-title" id="quiz-title"></div>
</header>

<main>
  <section class="portion-screen" id="portion-screen">
    <div class="portion-card">
      <div class="eyebrow" id="portion-eyebrow"></div>
      <h1 id="portion-heading"></h1>
      <p class="portion-copy" id="portion-copy"></p>
      <div class="portion-grid" id="portion-grid"></div>
    </div>
  </section>

  <section class="quiz-screen hidden" id="quiz-screen">
    <div class="quiz-hud">
      <div class="hud-row">
        <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
        <div class="score-pill" id="score-counter">0 / 0</div>
      </div>
    </div>
    <div id="question-feed" aria-live="polite"></div>
  </section>
</main>

<script>
const QUIZ_CONFIG = {
  quizName: "Maliyyə Hesabatlılığı Midterm",
  pageTitle: "Maliyyə Hesabatlılığı Midterm",
  homeUrl: "index.html",
  homeLabel: "Main Menu",
  portionEyebrow: "Choose your run",
  portionHeading: "Which part do you want to start?",
  questionCountLabel: "questions"
};

const PART_SIZE = 7;

const ITEMS = [
  { q: "Maliyyə Hesabatlılığının Beynəlxalq Standartlarının işlənib hazırlanmasının ilkin şərtləri və zəruriliyi",
    a: "Qlobal kapital bazarlarının sürətli inkişafı və beynəlxalq ticarətin genişlənməsi müxtəlif ölkələrin maliyyə hesabatları arasında müqayisəolunmanı təmin edən vahid dilin yaradılmasını zəruri etmişdir. MHBS müxtəlif milli mühasibat sistemləri arasındakı fərqləri aradan qaldırmaq, şəffaflığı artırmaq və investorların qərar qəbul etməsini asanlaşdırmaq məqsədilə işlənib hazırlanmışdır. Bu standartlar qlobal miqyasda kapitalın səmərəli bölüşdürülməsinə və maliyyə riski analizinin dürüstlüyünə xidmət edir." },
  { q: "Maliyyə Hesabatının Beynəlxalq Standartları Fondu, onun məqsədləri və strukturu",
    a: "MHBS Fondu (IFRS Foundation) beynəlxalq maliyyə hesabatlılığı standartlarının işlənilməsi, təşviqi və tətbiqinə nəzarət edən müstəqil, qeyri-kommersiya təşkilatıdır. Fondun əsas məqsədi ictimai maraqlara xidmət edən, yüksək keyfiyyətli, anlaşılır və icrası məcburi olan vahid qlobal standartlar toplusunu hazırlamaqdır. İyerarxik struktura Mütəvəllilər Heyəti (Trustees), Standartlar üzrə Beynəlxalq Şura (IASB) və Məsləhət Şurası kimi əsas idarəetmə orqanları daxildir." },
  { q: "Beynəlxalq standartların (IAS və IFRS) işlənib hazırlanması və qəbul edilməsi prosedurları və mərhələləri",
    a: "Standartların qəbulu şəffaf və açıq müzakirə (\"Due Process\") proseduru vasitəsilə həyata keçirilir. Əvvəlcə tədqiqat aparılır, gündəlik müəyyənləşdirilir, Müzakirə Sənədi (Discussion Paper) və ya Layihə Sənədi (Exposure Draft) hazırlanaraq ictimaiyyətin rəyinə təqdim olunur. Daxil olan təkliflər təkrar təhlil edildikdən sonra IASB üzvlərinin səsverməsi ilə yekun IFRS standartı təsdiqlənir və dərc olunur." },
  { q: "MHBS Fondu orqanlarının tərkibi və funksiyaları",
    a: "Fondun tərkibinə strateji istiqaməti müəyyən edən və maliyyələşməyə cavabdeh olan Qəyyumlardan (Trustees) ibarət Şura daxildir. Əsas icraedici orqan olan IASB standartların birbaşa hazırlanması və təsdiqinə cavabdehdir, MHBS Şərhlər Komitəsi (IFRIC) isə standartların tətbiqi zamanı ortaya çıxan qeyri-müəyyənliklərə rəsmi izahlar verir. Məsləhət Şurası (IFRS Advisory Council) isə tənzimləmə prosesində IASB-yə geniş ekspert tövsiyələri təqdim edir." },
  { q: "Maliyyə hesabatlarının təqdim edilməsinin Konseptual əsaslarının məzmunu və təyinatı",
    a: "Konseptual Əsaslar maliyyə hesabatlılığının təməl prinsiplərini, məqsədlərini, elementlərini və keyfiyyət xüsusiyyətlərini müəyyən edən standartüstü çərçivə sənədidir. O, özlüyündə bir standart olmasa da, IASB-yə yeni standartlar hazırlamaqda, mühasiblərə standartlarda birbaşa cavabı olmayan hallarda ardıcıl uçot siyasəti seçməkdə kömək edir. Sənəd istifadəçilərə mühasibat məlumatlarını doğru şərh etmək üçün konseptual bazanı təmin edir." },
  { q: "Ümumi təyinatlı maliyyə hesabatlarının təqdim edilməsinin məqsədi və onların istifadəçiləri",
    a: "Ümumi təyinatlı maliyyə hesabatlarının məqsədi müəssisəyə resurs təmin etməklə bağlı qərarlar qəbul edərkən mövcud və potensial investorlar, borc verənlər və digər kreditorlar üçün faydalı maliyyə informasiyasını təqdim etməkdir. Bu hesabatlar müəssisənin iqtisadi resursları, öhdəlikləri və onların dəyişməsi barədə tam mənzərə yaradır. Əsas istifadəçilərə investorlar, banklar, təchizatçılar, dövlət orqanları və analizçilər daxildir." },
  { q: "Maliyyə hesabatlılığının məqsədi və tərkibi, hesabat verən təşkilat",
    a: "Maliyyə hesabatlılığının məqsədi təşkilatın maliyyə vəziyyəti, fəaliyyətinin nəticələri və pul axınları haqqında dürüst və tərəfsiz məlumat verməkdir. Tərkibinə Maliyyə vəziyyəti haqqında hesabat, Məcmu gəlir haqqında hesabat, Kapitalda dəyişikliklər haqqında hesabat, Pul vəsaitlərinin hərəkəti haqqında hesabat və Qeydlər daxildir. Hesabat verən təşkilat isə maliyyə hesabatlarını hazırlamaq tələb olunan və ya bunu seçən hüquqi, yaxud müəyyən edilmiş qrup subyektdir." },
  { q: "Maliyyə hesabatlarının elementləri, onların tanınması və tanınmanın dayandırılması",
    a: "Hesabatların elementləri aktivlər, öhdəliklər, kapital, gəlir və xərclərdir. Element Konseptual Əsaslardakı tərifə cavab verdikdə və istifadəçilər üçün faydalı (relevant və dürüst) informasiya təmin etdikdə hesabatda tanınır. Tanınmanın dayandırılması isə aktiv üzərində nəzarət və ya öhdəlik üzrə borc tamamilə itirildikdə, ləğv edildikdə və ya üçüncü tərəfə ötürüldükdə həyata keçirilir." },
  { q: "Maliyyə hesabatlılığının məqsədi, təyinatı və tam komplekti",
    a: "Maliyyə hesabatlılığı müəssisənin iqtisadi resurslarını, maliyyə dayanıqlığını və idarəetmənin effektivliyini qiymətləndirmək üçün xidmət edir. Tam komplektə daxildir: dövrün sonuna Maliyyə vəziyyəti haqqında hesabat, dövr üzrə Məcmu gəlir hesabatı, Kapitalda dəyişikliklər hesabatı, Pul vəsaitlərinin hərəkəti hesabatı, uçot siyasəti və izahlı Qeydlər, habelə geriyə şamil olunan uçot düzəlişləri zamanı əvvəlki dövrün əvvəlinə olan balans hesabatı." },
  { q: "Maliyyə vəziyyəti haqqında hesabatın, məcmu gəlir haqqında hesabatın və kapitaldakı dəyişikliklər haqqında hesabatın strukturu və məzmunu",
    a: "Maliyyə vəziyyəti haqqında hesabat müəyyən tarixə aktivlərin, öhdəliklərin və kapitalın strukturunu göstərir. Məcmu gəlir haqqında hesabat dövr ərzində əldə edilən mənfəət/zərəri və birbaşa kapitalda əks olunan digər məcmu gəlirləri (OCI) əks etdirir. Kapitalda dəyişikliklər haqqında hesabat isə səhmdarlarla əməliyyatları, bölüşdürülməmiş mənfəətin və digər ehtiyatların dinamikasını tam açıqlayır." },

const sourceQuestions = ITEMS.map((item, i) => ({ ...item, number: `${i + 1}.` }));

/* ---------- Answer matching ---------- */

// Lowercase + strip Azerbaijani/Turkish diacritics so "ucot" == "Uçot"
function normalizeWord(word) {
  return word.toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/ə/g, "e").replace(/ı/g, "i");
}

// Words only — punctuation, brackets, quotes, slashes and hyphens are ignored
function tokenize(text) {
  return (text.match(/[\p{L}\p{N}]+/gu) || []).map((raw) => ({ raw, norm: normalizeWord(raw) }));
}

// Word-level LCS diff → eq / sub (wrong word) / missing / extra
function diffWords(expected, given) {
  const n = expected.length, m = given.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = expected[i].norm === given[j].norm ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const raw = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (expected[i].norm === given[j].norm) raw.push({ type: "eq", exp: expected[i++], got: given[j++] });
    else if (dp[i + 1][j] >= dp[i][j + 1]) raw.push({ type: "del", exp: expected[i++] });
    else raw.push({ type: "ins", got: given[j++] });
  }
  while (i < n) raw.push({ type: "del", exp: expected[i++] });
  while (j < m) raw.push({ type: "ins", got: given[j++] });

  const ops = [];
  let dels = [], ins = [];
  const flush = () => {
    const pairs = Math.min(dels.length, ins.length);
    for (let k = 0; k < pairs; k++) ops.push({ type: "sub", exp: dels[k], got: ins[k] });
    for (let k = pairs; k < dels.length; k++) ops.push({ type: "missing", exp: dels[k] });
    for (let k = pairs; k < ins.length; k++) ops.push({ type: "extra", got: ins[k] });
    dels = []; ins = [];
  };
  raw.forEach((op) => {
    if (op.type === "eq") { flush(); ops.push(op); }
    else if (op.type === "del") dels.push(op.exp);
    else ins.push(op.got);
  });
  flush();
  return ops;
}

function renderDiff(ops) {
  const box = document.createElement("div");
  box.className = "diff";
  const add = (text, cls, title) => {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    if (title) span.title = title;
    span.textContent = text;
    box.append(span, " ");
  };
  ops.forEach((op) => {
    if (op.type === "eq") add(op.got.raw);
    else if (op.type === "sub") { add(op.got.raw, "w-wrong", "Wrong word"); add(op.exp.raw, "w-fix", "Correct word"); }
    else if (op.type === "missing") add(op.exp.raw, "w-missing", "Missing word");
    else add(op.got.raw, "w-extra", "Extra word");
  });
  return box;
}

function renderLegend() {
  const legend = document.createElement("div");
  legend.className = "legend";
  [["w-wrong", "your wrong word"], ["w-fix", "correct word"], ["w-missing", "missing word"], ["w-extra", "extra word"]]
    .forEach(([cls, label]) => {
      const wrap = document.createElement("span");
      const s = document.createElement("span");
      s.className = cls;
      s.textContent = "söz";
      wrap.append(s, ` ${label}`);
      legend.appendChild(wrap);
    });
  return legend;
}

/* ---------- DOM ---------- */

const portionScreen = document.getElementById("portion-screen");
const portionGrid = document.getElementById("portion-grid");
const portionCopy = document.getElementById("portion-copy");
const quizScreen = document.getElementById("quiz-screen");
const feed = document.getElementById("question-feed");
const progress = document.getElementById("progress");
const scoreCounter = document.getElementById("score-counter");
const mainMenuLink = document.getElementById("main-menu-link");
const quizTitle = document.getElementById("quiz-title");
const portionEyebrow = document.getElementById("portion-eyebrow");
const portionHeading = document.getElementById("portion-heading");

let activeQuestions = [];
let selectedPortion = null;
let userAnswers = [];
let score = 0;
let resultCard = null;
let audioContext = null;
let flashLayer = null;
let toastEl = null;

function applyConfig() {
  document.title = QUIZ_CONFIG.pageTitle;
  mainMenuLink.href = QUIZ_CONFIG.homeUrl;
  mainMenuLink.textContent = QUIZ_CONFIG.homeLabel;
  quizTitle.textContent = QUIZ_CONFIG.quizName;
  portionEyebrow.textContent = QUIZ_CONFIG.portionEyebrow;
  portionHeading.textContent = QUIZ_CONFIG.portionHeading;
}

mainMenuLink.addEventListener("click", playActionSound);

function shuffleArray(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildPortions() {
  if (sourceQuestions.length <= PART_SIZE) return [{ label: "Full", start: 0, end: sourceQuestions.length, full: true }];
  const portions = [];
  for (let start = 0; start < sourceQuestions.length; start += PART_SIZE) {
    const end = Math.min(start + PART_SIZE, sourceQuestions.length);
    portions.push({ label: `${start + 1}-${end}`, start, end, full: false });
  }
  portions.push({ label: "Full", start: 0, end: sourceQuestions.length, full: true });
  return portions;
}

function renderPortions() {
  portionGrid.innerHTML = "";
  portionCopy.textContent = `${sourceQuestions.length} ${QUIZ_CONFIG.questionCountLabel} available. Type each answer exactly — pick a ${PART_SIZE}-question part or take the full quiz.`;
  buildPortions().forEach((portion) => {
    const button = document.createElement("button");
    button.className = "portion-btn";
    button.type = "button";
    const range = document.createElement("span");
    range.className = "portion-range";
    range.textContent = portion.label;
    const meta = document.createElement("span");
    meta.className = "portion-meta";
    meta.textContent = `${portion.end - portion.start} ${QUIZ_CONFIG.questionCountLabel}`;
    button.append(range, meta);
    button.addEventListener("click", () => { playStartSound(); startQuiz(portion); });
    portionGrid.appendChild(button);
  });
}

function startQuiz(portion) {
  selectedPortion = portion;
  let list = sourceQuestions.slice(portion.start, portion.end);
  if (portion.full) list = shuffleArray(list);
  activeQuestions = list;

  userAnswers = Array(activeQuestions.length).fill(null);
  score = 0;
  resultCard = null;

  portionScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  feed.innerHTML = "";
  renderQuestion(0);
  updateHud();
  window.scrollTo({ top: 0, behavior: "auto" });
}

function getSlide(index) { return feed.querySelector(`[data-index="${index}"]`); }

function goTo(index) {
  const slide = index >= activeQuestions.length ? feed.querySelector(".result-slide") : getSlide(index);
  if (!slide) return;
  slide.scrollIntoView({ behavior: "smooth", block: "start" });
  const box = slide.querySelector(".answer-box");
  if (box && !box.readOnly) window.setTimeout(() => box.focus({ preventScroll: true }), 450);
}

function renderQuestion(index) {
  if (getSlide(index)) return;
  const question = activeQuestions[index];

  const slide = document.createElement("section");
  slide.className = "question-slide";
  slide.dataset.index = String(index);

  const card = document.createElement("article");
  card.className = "question-card";

  const confetti = document.createElement("div");
  confetti.className = "confetti";

  const meta = document.createElement("div");
  meta.className = "question-meta";
  const current = document.createElement("span");
  current.textContent = `Question ${index + 1} / ${activeQuestions.length}`;
  const original = document.createElement("span");
  original.textContent = `Original ${question.number}`;
  meta.append(current, original);

  const text = document.createElement("div");
  text.className = "question-text";
  text.textContent = question.q;

  const box = document.createElement("textarea");
  box.className = "answer-box";
  box.placeholder = "Type the exact answer…";
  box.spellcheck = false;
  box.autocomplete = "off";
  box.setAttribute("autocapitalize", "off");

  const actions = document.createElement("div");
  actions.className = "answer-actions";
  const check = makeButton("Check", "primary-btn");
  const giveUp = makeButton("I don't know", "ghost-btn");
  const retry = makeButton("Try again", "primary-btn hidden");
  const next = makeButton(index === activeQuestions.length - 1 ? "See result ↓" : "Next question ↓", "ghost-btn hidden");
  const kbd = document.createElement("span");
  kbd.className = "kbd-hint";
  kbd.textContent = "Ctrl / ⌘ + Enter to check";
  actions.append(check, giveUp, retry, next, kbd);

  const verdict = document.createElement("div");
  verdict.className = "verdict";

  const feedback = document.createElement("div");
  feedback.className = "card-feedback";

  const ui = { card, box, check, giveUp, retry, next, kbd, verdict, feedback };

  function trySubmit() {
    if (box.readOnly) return;
    if (!box.value.trim()) { showToast("Type your answer first"); box.focus(); return; }
    submitAnswer(index, ui, false);
  }

  check.addEventListener("click", trySubmit);
  giveUp.addEventListener("click", () => { if (!box.readOnly) submitAnswer(index, ui, true); });
  retry.addEventListener("click", () => { playActionSound(); resetForRetry(ui); });
  next.addEventListener("click", () => { playActionSound(); goTo(index + 1); });
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); trySubmit(); }
  });

  card.append(confetti, meta, text, box, actions, verdict, feedback);
  slide.appendChild(card);

  const resultSlide = feed.querySelector(".result-slide");
  if (resultSlide) feed.insertBefore(slide, resultSlide); else feed.appendChild(slide);
}

function makeButton(label, cls) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = cls;
  b.textContent = label;
  return b;
}

function resetForRetry(ui) {
  ui.box.readOnly = false;
  ui.box.classList.remove("right", "wrong");
  ui.card.classList.remove("correct-answer", "wrong-answer");
  ui.verdict.textContent = "";
  ui.verdict.className = "verdict";
  ui.check.classList.remove("hidden");
  ui.giveUp.classList.remove("hidden");
  ui.kbd.classList.remove("hidden");
  ui.retry.classList.add("hidden");
  // feedback stays visible so the user can see what to fix while editing
  ui.box.focus({ preventScroll: true });
  const len = ui.box.value.length;
  ui.box.setSelectionRange(len, len);
}

function submitAnswer(index, ui, gaveUp) {
  const question = activeQuestions[index];
  const prev = userAnswers[index];
  const given = gaveUp ? "" : ui.box.value;
  const expectedTokens = tokenize(question.a);
  const givenTokens = tokenize(given);
  const ops = diffWords(expectedTokens, givenTokens);
  const matched = ops.filter((op) => op.type === "eq").length;
  const isCorrect = !gaveUp && matched === expectedTokens.length && givenTokens.length === expectedTokens.length;
  const total = expectedTokens.length + givenTokens.length;
  const pct = total ? Math.round((200 * matched) / total) : 0;
  const attempts = (prev ? prev.attempts : 0) + 1;
  const firstTryCorrect = prev ? prev.firstTryCorrect : isCorrect;

  if (!prev && isCorrect) score++;

  userAnswers[index] = {
    question: question.q,
    questionNumber: question.number,
    correctAnswer: question.a,
    ops, pct, gaveUp, isCorrect, attempts, firstTryCorrect,
    firstOps: prev ? prev.firstOps : ops
  };

  // Lock the box and swap buttons
  ui.box.readOnly = true;
  ui.box.classList.remove("right", "wrong");
  ui.box.classList.add(isCorrect ? "right" : "wrong");
  ui.check.classList.add("hidden");
  ui.giveUp.classList.add("hidden");
  ui.kbd.classList.add("hidden");
  ui.retry.classList.toggle("hidden", isCorrect);
  ui.next.classList.remove("hidden");

  // Verdict + instant highlight
  ui.verdict.className = `verdict ${isCorrect ? "good" : "bad"}`;
  if (isCorrect) {
    ui.verdict.textContent = attempts === 1 ? "Exact match ✓" : `Fixed ✓ — exact on attempt ${attempts} (score counts first tries only)`;
  } else if (gaveUp) {
    ui.verdict.textContent = "Skipped — here's the full answer. Press Try again to type it yourself.";
  } else {
    ui.verdict.textContent = `Not exact — ${pct}% match. Fix the highlighted words and press Try again.`;
  }

  ui.feedback.innerHTML = "";
  if (!isCorrect) ui.feedback.append(renderLegend(), renderDiff(ops));

  ui.card.classList.remove("correct-answer", "wrong-answer");
  void ui.card.offsetWidth;
  ui.card.classList.add(isCorrect ? "correct-answer" : "wrong-answer");

  // First check unlocks the next card / the result
  if (!prev) {
    if (index + 1 < activeQuestions.length) renderQuestion(index + 1);
    else renderResult();
  }
  if (resultCard) fillResult(resultCard);

  updateHud();
  playSound(isCorrect);
  triggerFlash(isCorrect);
  triggerHaptics(isCorrect);
  burstParticles(ui.card, isCorrect);
}

function updateHud() {
  const answeredCount = userAnswers.filter(Boolean).length;
  const percent = activeQuestions.length ? (answeredCount / activeQuestions.length) * 100 : 0;
  progress.style.width = `${percent}%`;
  scoreCounter.textContent = `${score} / ${activeQuestions.length}`;
}

function renderResult() {
  if (resultCard) return;
  const slide = document.createElement("section");
  slide.className = "question-slide result-slide";
  resultCard = document.createElement("article");
  resultCard.className = "result-card finished";
  slide.appendChild(resultCard);
  feed.appendChild(slide);
  fillResult(resultCard);
  window.setTimeout(() => { burstParticles(resultCard, true, 72); playFinishSound(); }, 120);
}

function fillResult(card) {
  card.innerHTML = "";
  const confetti = document.createElement("div");
  confetti.className = "confetti";

  const eyebrow = document.createElement("div");
  eyebrow.className = "eyebrow";
  eyebrow.textContent = selectedPortion.full ? "Full quiz complete" : `Part ${selectedPortion.label} complete`;

  const title = document.createElement("h1");
  title.textContent = "Finished";

  const scoreDisplay = document.createElement("div");
  scoreDisplay.className = "score-display";
  scoreDisplay.textContent = `${score}/${activeQuestions.length}`;

  const fixedCount = userAnswers.filter((a) => a && !a.firstTryCorrect && a.isCorrect).length;
  const percentage = document.createElement("div");
  percentage.className = "score-percentage";
  percentage.textContent = `${Math.round((score / activeQuestions.length) * 100)}% exact on first try` +
    (fixedCount ? ` · ${fixedCount} fixed on retry` : "");

  const actions = document.createElement("div");
  actions.className = "result-actions";
  const retry = makeButton("Retry part", "primary-btn");
  retry.addEventListener("click", () => { playActionSound(); startQuiz(selectedPortion); });
  const choose = makeButton("Select different portion", "ghost-btn");
  choose.addEventListener("click", () => { playActionSound(); showPortionPicker(); });
  const menu = document.createElement("a");
  menu.className = "ghost-btn";
  menu.href = QUIZ_CONFIG.homeUrl;
  menu.textContent = QUIZ_CONFIG.homeLabel;
  menu.addEventListener("click", playActionSound);
  actions.append(retry, choose, menu);

  card.append(confetti, eyebrow, title, scoreDisplay, percentage, actions);

  const mistakes = userAnswers
    .map((a, i) => ({ a, i }))
    .filter(({ a }) => a && !a.firstTryCorrect);

  if (mistakes.length) {
    const section = document.createElement("div");
    section.className = "mistakes-section";
    const heading = document.createElement("h2");
    heading.textContent = "Review mistakes";
    section.append(heading, renderLegend());

    mistakes.forEach(({ a, i }) => {
      const item = document.createElement("div");
      item.className = `mistake-item${a.isCorrect ? " fixed" : ""}`;
      const q = document.createElement("div");
      q.className = "mistake-question";
      q.textContent = `${a.questionNumber} ${a.question}`;
      const sc = document.createElement("div");
      sc.className = "mistake-score";
      sc.textContent = a.isCorrect
        ? `Fixed on attempt ${a.attempts} — your first attempt:`
        : a.gaveUp ? "Skipped — the whole answer is missing" : `${a.pct}% match (attempt ${a.attempts})`;
      const goBtn = makeButton("Go to question ↑", "ghost-btn");
      goBtn.style.marginTop = "8px";
      goBtn.addEventListener("click", () => goTo(i));
      item.append(q, sc, renderDiff(a.isCorrect ? a.firstOps : a.ops));
      if (!a.isCorrect) item.appendChild(goBtn);
      section.appendChild(item);
    });
    card.appendChild(section);
  }
}

function showPortionPicker() {
  quizScreen.classList.add("hidden");
  portionScreen.classList.remove("hidden");
  feed.innerHTML = "";
  resultCard = null;
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* ---------- Sound / effects ---------- */

function getAudio() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return null;
  audioContext = audioContext || new AudioCtx();
  return audioContext;
}

function playNotes(notes) {
  try {
    const ctx = getAudio();
    if (!ctx) return;
    const now = ctx.currentTime;
    notes.forEach((n) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const start = now + n.start;
      const end = start + n.duration;
      osc.type = n.type || "triangle";
      osc.frequency.setValueAtTime(n.frequency, start);
      if (n.slideTo) osc.frequency.exponentialRampToValueAtTime(n.slideTo, end);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(n.volume, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(end + 0.02);
    });
  } catch (e) {}
}

function playSound(isCorrect) {
  playNotes(isCorrect
    ? [{ frequency: 523.25, start: 0, duration: 0.11, volume: 0.2 },
       { frequency: 659.25, start: 0.08, duration: 0.12, volume: 0.22 },
       { frequency: 987.77, start: 0.17, duration: 0.2, type: "sine", volume: 0.24 }]
    : [{ frequency: 196, start: 0, duration: 0.16, type: "sawtooth", volume: 0.16, slideTo: 141 },
       { frequency: 146.83, start: 0.1, duration: 0.22, type: "square", volume: 0.13, slideTo: 106 }]);
}
function playStartSound() {
  playNotes([{ frequency: 329.63, start: 0, duration: 0.1, volume: 0.16 },
             { frequency: 493.88, start: 0.055, duration: 0.12, volume: 0.18 },
             { frequency: 659.25, start: 0.12, duration: 0.16, volume: 0.2 }]);
}
function playActionSound() {
  playNotes([{ frequency: 587.33, start: 0, duration: 0.13, volume: 0.12, slideTo: 739.99 }]);
}
function playFinishSound() {
  playNotes([392, 523.25, 659.25, 783.99, 1046.5].map((f, i) => ({
    frequency: f, start: i * 0.075, duration: 0.22, type: i === 4 ? "sine" : "triangle", volume: 0.2
  })));
}

function triggerFlash(isCorrect) {
  flashLayer = flashLayer || document.createElement("div");
  if (!flashLayer.parentNode) document.body.appendChild(flashLayer);
  flashLayer.className = `answer-flash ${isCorrect ? "correct" : "incorrect"}`;
  window.setTimeout(() => { flashLayer.className = "answer-flash"; }, 700);
}

function triggerHaptics(isCorrect) {
  if (!navigator.vibrate) return;
  navigator.vibrate(isCorrect ? [18, 28, 18] : [42, 32, 42]);
}

function burstParticles(card, isCorrect, overrideCount) {
  const container = card.querySelector(".confetti");
  if (!container) return;
  const colors = isCorrect ? ["#2563eb","#16a34a","#f59e0b","#22c55e","#0f766e"] : ["#dc2626","#f97316","#991b1b","#fca5a5","#7f1d1d"];
  const count = overrideCount || (isCorrect ? 48 : 28);
  container.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const piece = document.createElement(isCorrect ? "i" : "span");
    if (isCorrect) { piece.style.background = colors[i % colors.length]; }
    else {
      piece.className = "x-particle"; piece.textContent = "X";
      piece.style.color = colors[i % colors.length];
      piece.style.setProperty("--r", `${Math.round(Math.random() * 520 - 260)}deg`);
    }
    piece.style.setProperty("--x", `${Math.round(Math.random() * 620 - 310)}px`);
    piece.style.setProperty("--y", `${Math.round(Math.random() * 420 - 290)}px`);
    piece.style.animationDelay = `${Math.random() * 120}ms`;
    container.appendChild(piece);
  }
  window.setTimeout(() => { container.innerHTML = ""; }, 1400);
}

function showToast(message) {
  toastEl = toastEl || document.createElement("div");
  if (!toastEl.parentNode) document.body.appendChild(toastEl);
  toastEl.className = "toast";
  toastEl.textContent = message;
  void toastEl.offsetWidth;
  toastEl.classList.add("show");
}

applyConfig();

if (sourceQuestions.length > PART_SIZE) {
  renderPortions();
} else {
  startQuiz({ label: "Full", start: 0, end: sourceQuestions.length, full: true });
}
</script>
